name: cst
options:
  bundleIdPrefix: net.tlog
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  cst:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_NAME: cst
        PRODUCT_BUNDLE_IDENTIFIER: net.tlog.cst-app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
  cstTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: cst
